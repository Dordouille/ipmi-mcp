[project]
name = "ipmi-mcp"
version = "0.1.0"
description = "MCP server driving a BMC over IPMI (ipmitool)."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Laurent Sanz" }]
dependencies = [
    # Official SDK 2.x: high-level MCPServer class (from mcp.server import MCPServer).
    "mcp>=2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
ipmi-mcp = "ipmi_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ipmi_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
